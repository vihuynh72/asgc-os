name: Office Hours Cron

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub Actions minimum interval, UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: office-hours-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_BASE_URL:-}" ]; then
            echo "Missing required secret: PROD_BASE_URL"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

          base="${PROD_BASE_URL%/}"
          if [[ "$base" != https://* ]]; then
            echo "PROD_BASE_URL must use HTTPS"
            exit 1
          fi

          url="${base}/api/cron/office-hours-reminders"
          status="$(
            curl --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --max-time 60 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "User-Agent: github-actions-office-hours-cron" \
              "$url"
          )"

          echo "Cron endpoint returned HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
